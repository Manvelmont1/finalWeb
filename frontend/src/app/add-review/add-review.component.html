<div class="container">
  <div class="card">
    <h2>{{ isEdit ? 'Editar Reseña' : 'Agregar Reseña' }}</h2>

    <form [formGroup]="reviewForm" (ngSubmit)="onSubmit()">

      <div class="form-group">
        <label>Nombre</label>
        <input type="text" formControlName="nombre" placeholder="Tu nombre" />
      </div>

      <div class="form-group">
        <label>Comentario</label>
        <textarea formControlName="comentario" placeholder="Escribe tu reseña aquí"></textarea>
      </div>

      <div class="form-group">
        <label>Calificación</label>

        <div class="stars">
          <span
            *ngFor="let s of stars"
            class="star"
            [class.active]="s <= reviewForm.get('calificacion')?.value"
            (click)="setRating(s)">
            ★
          </span>
        </div>

        <small class="hint">
          {{ 
            reviewForm.get('calificacion')?.value 
              ? reviewForm.get('calificacion')?.value + ' estrellas'
              : 'Sin calificación' 
          }}
        </small>

      </div>

      <button type="submit" class="btn btn-success">
        {{ isEdit ? 'Actualizar' : 'Guardar' }}
      </button>

      <a routerLink="/reviews" class="btn btn-primary btn-block">Volver</a>

    </form>
  </div>
</div>
